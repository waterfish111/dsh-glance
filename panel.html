<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一瞥</title>
<style>
  :root {
    --bg: rgba(16, 19, 27, 0.82);
    --bg-2: rgba(11, 14, 20, 0.72);
    --text: #e9eef7;
    --muted: #939db0;
    --dim: #6d778a;
    --accent: #4c8dff;
    --accent-hover: #66a0ff;
    --stroke: rgba(255, 255, 255, 0.075);
    --code-bg: rgba(255, 255, 255, 0.075);
    --radius: 16px;
    --max-height: 70vh;
    --max-width: 80vw;
    --sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Code", "Consolas", "SF Mono", "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: transparent;
    overflow: hidden;
  }

  body {
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: var(--max-width);
    height: 100%;
    max-height: var(--max-height);
    margin: 0 auto;
    overflow: hidden;
    border-radius: var(--radius);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 26%),
      var(--bg);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    backdrop-filter: blur(26px) saturate(140%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.07),
      inset 0 0 0 1px rgba(255, 255, 255, 0.045);
  }

  /* ---------- title bar ---------- */

  .titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 62px;
    padding: 0 16px 0 24px;
    user-select: none;
    cursor: default;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .title-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }
  .icon-btn:active { background: rgba(255, 255, 255, 0.18); }
  .icon-btn.close:hover { background: rgba(232, 74, 90, 0.9); color: #fff; }
  .icon-btn.custom { color: var(--accent); }
  .icon-btn.custom:hover { background: rgba(77, 163, 255, 0.18); color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ---------- content ---------- */

  .content {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    margin: 0 18px 12px;
    padding: 20px 22px 10px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.042);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.055);
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
  }

  .content::-webkit-scrollbar { width: 7px; height: 7px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .content::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.28);
    background-clip: padding-box;
  }

  .content-inner { display: block; }

  .shot {
    display: flex;
    justify-content: center;
    margin: 0 0 16px;
  }

  .shot img {
    display: block;
    max-width: 100%;
    max-height: min(240px, 30vh);
    border-radius: 12px;
    object-fit: contain;
    background: #0a0c12;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.075), 0 6px 20px rgba(0, 0, 0, 0.28);
  }

  .analysis-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    min-height: 24px;
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 16px;
    font-weight: 650;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .thread-tag {
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    white-space: nowrap;
  }

  .turn {
    padding: 0 0 12px;
    margin: 0 0 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
  }
  .turn-q {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    word-break: break-word;
  }
  .turn-q::before {
    content: "你问 · ";
    color: var(--dim);
  }
  .turn-a {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.65;
    max-height: 5.1em;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    -webkit-mask-image: linear-gradient(to bottom, #000 58%, rgba(0, 0, 0, 0.1));
    mask-image: linear-gradient(to bottom, #000 58%, rgba(0, 0, 0, 0.1));
  }
  .turn-a.open {
    max-height: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
  .turn-a .md-p,
  .turn-a p { margin: 0 0 0.5em; }
  .turn-a .md-p:last-child,
  .turn-a p:last-child { margin-bottom: 0; }
  .turn-fresh {
    margin-bottom: 10px;
  }

  .stop-mark {
    margin: 7px 0 0;
    font-size: 11.5px;
    color: #d8ab4b;
    letter-spacing: 0.01em;
  }
  .stop-mark::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: #d8ab4b;
    margin-right: 7px;
    vertical-align: 1px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--dim);
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--dim);
    flex: 0 0 auto;
  }
  .status.busy { color: var(--muted); }
  .status.busy .status-dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .status.done .status-dot { background: #3ecf8e; }
  .status.error { color: #ff8d9c; }
  .status.error .status-dot { background: #ff5f75; }
  .notice {
    margin: 0 0 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(76, 141, 255, 0.14);
    color: #b9c7e2;
    font-size: 12.5px;
    line-height: 1.5;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .analysis-body {
    font-size: 14px;
    line-height: 1.75;
    color: #dbe2ee;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .analysis-body .empty { color: var(--dim); }
  .analysis-body h4 {
    margin: 16px 0 8px;
    font-size: 15.5px;
    font-weight: 650;
    color: var(--text);
  }
  .analysis-body p { margin: 0 0 10px; }
  .analysis-body ul { margin: 0 0 10px; padding-left: 20px; }
  .analysis-body li { margin: 3px 0; }
  .analysis-body strong { color: #fff; font-weight: 650; }

  .analysis-body code {
    font-family: var(--mono);
    font-size: 0.92em;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--code-bg);
    color: #d7e3ff;
    word-break: break-all;
  }

  .analysis-body code.path {
    color: #cfe0ff;
    padding: 2px 11px;
    border-radius: 999px;
    background: rgba(76, 141, 255, 0.17);
    box-shadow: inset 0 0 0 1px rgba(76, 141, 255, 0.24);
  }

  .analysis-body pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.32);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
  }

  .analysis-body pre code {
    display: block;
    padding: 0;
    background: transparent;
    color: #cfe0ff;
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre;
    word-break: normal;
  }

  .analysis-body pre::-webkit-scrollbar { height: 8px; }
  .analysis-body pre::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 8px;
  }

  .analysis-body .error-text { color: #ff9aa8; }

  /* ---------- composer ---------- */

  .composer {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
    margin: 0 18px 18px;
    padding: 8px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.045);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.055);
  }

  .input-wrap {
    flex: 1 1 100%;
    min-width: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    transition: box-shadow 0.15s ease, background-color 0.15s ease;
  }

  .input-wrap:focus-within {
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 0 0 1px rgba(76, 141, 255, 0.5);
  }

  #note {
    display: block;
    width: 100%;
    max-height: 122px;
    padding: 12px 14px;
    border: 0;
    border-radius: 12px;
    outline: none;
    resize: none;
    overflow-y: hidden;
    background: transparent;
    color: var(--text);
    font: inherit;
    line-height: 1.5;
    scrollbar-width: none;
  }

  #note::placeholder { color: var(--dim); }
  #note::-webkit-scrollbar { display: none; }

  .actions {
    display: flex;
    flex: 1 1 100%;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }

  .btn.stop { display: none; min-width: 72px; }
  .btn.stop.on { display: inline-flex; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 12px;
    white-space: nowrap;
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
  }

  .btn:active { transform: translateY(0.5px); }

  .btn.ghost {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--text);
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.3); }
  .btn.ghost:active { background: rgba(255, 255, 255, 0.12); }

  .btn.primary {
    min-width: 92px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(76, 141, 255, 0.32);
  }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled {
    opacity: 0.5;
    cursor: default;
    box-shadow: none;
  }
  @media (max-width: 380px) {
    .composer { gap: 8px; margin: 0 12px 12px; padding: 8px; }
    .btn { padding: 0 12px; font-size: 12.5px; }
    .btn.primary { min-width: 78px; }
    .btn.stop { min-width: 56px; }
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <header class="titlebar" id="titlebar">
    <div class="brand">
      <span class="brand-name">一瞥</span>
    </div>
    <div class="title-actions">
      <button class="icon-btn" id="skin" title="更换悬浮球图片" aria-label="更换悬浮球图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.8 2-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .9-1.9 1.9-1.9h1.1A5 5 0 0 0 21 9.6C21 5.8 17 3 12 3z" />
          <circle cx="7.7" cy="11.6" r="1.05" />
          <circle cx="11" cy="7.7" r="1.05" />
          <circle cx="15.3" cy="9.3" r="1.05" />
        </svg>
      </button>
      <button class="icon-btn" id="minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 12h12" />
        </svg>
      </button>
      <button class="icon-btn close" id="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M7 7l10 10M17 7L7 17" />
        </svg>
      </button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="content-inner" id="content-inner">
      <figure class="shot" id="shot-wrap" style="display:none">
        <img id="shot" alt="截图预览">
      </figure>
      <section class="analysis">
        <div class="analysis-head">
          <span class="section-title">分析结果</span>
          <span class="thread-tag" id="thread-tag" hidden></span>
          <span class="status" id="status"><span class="status-dot"></span><span id="status-text">待发送</span></span>
        </div>
        <div class="analysis-body" id="analysis-body">
          <div class="empty">截图就绪，说明你想让我看什么。</div>
        </div>
      </section>
    </div>
  </main>

  <footer class="composer">
    <div class="input-wrap">
      <textarea id="note" rows="1" placeholder="说明你想让我看什么，例如：检查作业、批改文章…"></textarea>
    </div>
    <div class="actions">
      <button class="btn ghost stop" id="stop">停止</button>
      <button class="btn primary" id="send" disabled>发送</button>
      <button class="btn ghost" id="rescan">重新框选</button>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  window.onerror = function (message, source, lineno, colno) {
    try {
      var statusEl = document.getElementById('status-text');
      if (statusEl) statusEl.textContent = '脚本错误 ' + lineno + ': ' + message;
    } catch (displayError) { }
    try {
      window.chrome.webview.postMessage({ type: 'page-error', message: String(message), line: lineno });
    } catch (postError) { }
    return false;
  };

  var bridge = window.chrome && window.chrome.webview ? window.chrome.webview : null;

  function post(message) {
    if (!bridge) return;
    try { bridge.postMessage(message); } catch (error) { /* host gone */ }
  }

  var els = {
    panel: document.getElementById('panel'),
    titlebar: document.getElementById('titlebar'),
    content: document.getElementById('content'),
    inner: document.getElementById('content-inner'),
    shotWrap: document.getElementById('shot-wrap'),
    shot: document.getElementById('shot'),
    status: document.getElementById('status'),
    statusText: document.getElementById('status-text'),
    threadTag: document.getElementById('thread-tag'),
    body: document.getElementById('analysis-body'),
    note: document.getElementById('note'),
    send: document.getElementById('send'),
    stop: document.getElementById('stop'),
    rescan: document.getElementById('rescan'),
    minimize: document.getElementById('minimize'),
    skin: document.getElementById('skin'),
    close: document.getElementById('close')
  };

  var PALETTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.8 2-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .9-1.9 1.9-1.9h1.1A5 5 0 0 0 21 9.6C21 5.8 17 3 12 3z"/><circle cx="7.7" cy="11.6" r="1.05"/><circle cx="11" cy="7.7" r="1.05"/><circle cx="15.3" cy="9.3" r="1.05"/></svg>';
  var RESET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.4h4.4"/></svg>';
  var TURN_HINT_AT = 6;

  function updateSkinButton() {
    if (!els.skin) return;
    var title = state.custom ? '恢复默认外观' : '更换悬浮球图片';
    els.skin.title = title;
    els.skin.setAttribute('aria-label', title);
    els.skin.classList.toggle('custom', Boolean(state.custom));
    els.skin.innerHTML = state.custom ? RESET_ICON : PALETTE_ICON;
  }

  var state = {
    text: '',
    error: '',
    notice: '',
    busy: false,
    hasImage: false,
    sent: false,
    custom: false,
    turns: [],
    thread: null,
    stopped: false,
    lastHeight: 0,
    maxHeight: 9999,
    stick: true
  };

  /* ---------- markdown-lite renderer ---------- */

  function escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var PATH_RE = /(?:[A-Za-z]:\\[^\s<>"'`]+|\/(?:[\w.\-]+\/)+[\w.\-]+(?::\d+(?::\d+)?)?)/g;

  function plainHtml(text) {
    var escaped = escapeHtml(text);
    escaped = escaped.replace(PATH_RE, function (match) {
      return '<code class="path">' + match + '</code>';
    });
    return escaped;
  }

  function inlineHtml(text) {
    var out = '';
    var last = 0;
    var re = /`([^`\n]+)`/g;
    var match;
    while ((match = re.exec(text)) !== null) {
      out += plainHtml(text.slice(last, match.index));
      out += '<code>' + escapeHtml(match[1]) + '</code>';
      last = re.lastIndex;
    }
    out += plainHtml(text.slice(last));
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    return out;
  }

  function blockHtml(text) {
    var lines = text.split('\n');
    var html = '';
    var listOpen = false;

    function closeList() {
      if (listOpen) { html += '</ul>'; listOpen = false; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();

      if (trimmed === '') {
        closeList();
        html += '<br>';
        continue;
      }

      if (/^[-*+]\s+/.test(trimmed)) {
        if (!listOpen) { html += '<ul>'; listOpen = true; }
        html += '<li>' + inlineHtml(trimmed.replace(/^[-*+]\s+/, '')) + '</li>';
        continue;
      }

      closeList();

      if (/^#{1,4}\s+/.test(trimmed)) {
        html += '<h4>' + inlineHtml(trimmed.replace(/^#{1,4}\s+/, '')) + '</h4>';
        continue;
      }

      html += '<p>' + inlineHtml(line) + '</p>';
    }

    closeList();
    return html;
  }

  function renderMarkdown(text) {
    if (!text) return '';
    var parts = text.split('```');
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var code = parts[i].replace(/^^[A-Za-z0-9_+\-.#]+\n/, '').replace(/\n$/, '');
        html += '<pre><code>' + escapeHtml(code) + '</code></pre>';
      } else {
        html += blockHtml(parts[i]);
      }
    }
    return html;
  }

  /* ---------- height / autosize ---------- */

  var measureScheduled = false;

  function scheduleMeasure() {
    if (measureScheduled) return;
    measureScheduled = true;
    requestAnimationFrame(function () {
      measureScheduled = false;
      measure();
    });
  }

  function measure() {
    if (!state.hasImage) return;
    var header = els.titlebar.offsetHeight;
    var footer = document.querySelector('.composer').offsetHeight;
    var style = getComputedStyle(els.content);
    var pad = parseFloat(style.paddingTop || '0') + parseFloat(style.paddingBottom || '0');
    var innerHeight = els.inner.scrollHeight;
    if (state.hasImage) {
      innerHeight = Math.max(innerHeight, els.shotWrap.offsetHeight + 100);
    }
    var desired = Math.ceil(header + footer + pad + innerHeight + 30 + 2);
    if (state.hasImage) desired = Math.max(desired, 360);
    var height = Math.max(200, Math.min(desired, state.maxHeight));
    if (Math.abs(height - state.lastHeight) > 2) {
      state.lastHeight = height;
      post({ type: 'height', height: height });
    }
  }

  function autosize() {
    els.note.style.height = 'auto';
    var next = Math.min(els.note.scrollHeight, 122);
    els.note.style.height = next + 'px';
    els.note.style.overflowY = els.note.scrollHeight > 122 ? 'auto' : 'hidden';
    scheduleMeasure();
  }

  /* ---------- rendering ---------- */

  function scrollToBottomIfSticking() {
    if (!state.stick) return;
    els.content.scrollTop = els.content.scrollHeight;
  }

  /**
   * Older turns collapse into bubbles above the live answer. The newest answer
   * keeps the full-width markdown treatment so single-turn use looks unchanged.
   */
  function renderFinishedTurns() {
    var finished = state.turns.length > 1 ? state.turns.slice(0, -1) : [];
    var out = '';
    for (var i = 0; i < finished.length; i += 1) {
      var turn = finished[i];
      out += '<div class="turn">' +
        '<div class="turn-q">' + escapeHtml(turn.q) + '</div>' +
        '<div class="turn-a">' +
        (turn.a ? renderMarkdown(turn.a) : '<span>（这次没有留下回答）</span>') +
        '</div>' +
        (turn.stopped ? '<p class="stop-mark">这次回答被停止了，可能不完整。</p>' : '') +
        '</div>';
    }
    return out;
  }

  function render() {
    var html = state.notice ? '<p class="notice">' + escapeHtml(state.notice) + '</p>' : '';
    html += renderFinishedTurns();
    if (state.error) {
      html += '<p class="error-text">' + escapeHtml(state.error) + '</p>';
    } else if (state.text) {
      html += '<div class="turn-fresh">' + renderMarkdown(state.text) + '</div>';
    } else if (state.busy) {
      html += '<div class="empty">正在读取画面并分析…</div>';
    } else if (state.turns.length === 0) {
      html += '<div class="empty">截图就绪，说明你想让我看什么。</div>';
    }
    if (state.stopped) {
      html += '<p class="stop-mark">已停止，这段回答不完整。</p>';
    }
    els.body.innerHTML = html;
    scrollToBottomIfSticking();
    scheduleMeasure();
  }

  function setStatus(text, kind) {
    els.status.className = 'status' + (kind ? ' ' + kind : '');
    els.statusText.textContent = text;
  }

  function updateSendState() {
    var hasText = els.note.value.trim().length > 0;
    els.send.disabled = state.busy || !state.hasImage || (state.sent && !hasText);
  }

  function setBusy(busy) {
    state.busy = busy;
    els.note.disabled = busy;
    els.stop.classList.toggle('on', busy);
    els.send.textContent = busy ? '思考中' : (state.sent ? '追问' : '发送');
    updateSendState();
    if (busy) setStatus('分析中…', 'busy');
  }

  function resetForCapture() {
    state.text = '';
    state.error = '';
    state.notice = '';
    state.stick = true;
    state.busy = false;
    state.hasImage = true;
    state.sent = false;
    state.turns = [];
    state.thread = null;
    state.stopped = false;
    updateThreadTag();
    setStatus('待发送', '');
    els.stop.classList.remove('on');
    els.note.disabled = false;
    els.note.value = '';
    els.send.textContent = '发送';
    updateSendState();
    autosize();
    render();
  }

  /* ---------- host messages ---------- */

  function onInit(msg) {
    if (msg && typeof msg.maxHeight === 'number' && msg.maxHeight > 200) {
      state.maxHeight = Math.floor(msg.maxHeight);
      document.documentElement.style.setProperty('--max-height', state.maxHeight + 'px');
    }
    if (msg && typeof msg.maxWidth === 'number' && msg.maxWidth > 400) {
      document.documentElement.style.setProperty('--max-width', Math.floor(msg.maxWidth) + 'px');
    }
    state.custom = Boolean(msg && msg.custom);
    updateSkinButton();
    scheduleMeasure();
  }

  function onCapture(msg) {
    if (!msg || typeof msg.imageBase64 !== 'string' || !msg.imageBase64) return;
    state.lastHeight = 0;
    els.shotWrap.style.display = 'block';
    els.shot.src = 'data:image/png;base64,' + msg.imageBase64;
    resetForCapture();
    els.content.scrollTop = 0;
    state.stick = true;
    els.note.focus();
    scheduleMeasure();
  }

  function onDelta(msg) {
    if (!msg || typeof msg.text !== 'string') return;
    if (!state.busy) setBusy(true);
    state.text += msg.text;
    render();
  }

  function onReplace(msg) {
    if (!msg) return;
    if (!state.busy) setBusy(true);
    state.text = typeof msg.text === 'string' ? msg.text : '';
    render();
  }

  function onDone() {
    state.busy = false;
    setBusy(false);
    setStatus('分析完成', 'done');
    els.note.focus();
    scheduleMeasure();
  }

  function onError(msg) {
    state.busy = false;
    state.error = msg && msg.message ? String(msg.message) : '分析失败';
    setBusy(false);
    setStatus('分析失败', 'error');
    render();
    scheduleMeasure();
  }

  function onStopped() {
    setBusy(false);
    setStatus('已停止', '');
    // Keep whatever the model managed to write; the marker says it is partial.
    state.stopped = true;
    els.note.focus();
    render();
    scheduleMeasure();
  }

  function onThread(msg) {
    state.thread = msg && msg.sessionId ? {
      sessionId: String(msg.sessionId),
      title: msg.title ? String(msg.title) : '',
      turns: Number(msg.turns) || 0,
      startedAt: Number(msg.startedAt) || 0
    } : null;
    updateThreadTag();
  }

  function onSessionReset() {
    state.notice = '上次的分析会话已失效，已新建会话，之前的上下文不再保留。';
    render();
    scheduleMeasure();
  }

  if (bridge) {
    bridge.addEventListener('message', function (event) {
      var msg = event.data;
      if (!msg || !msg.type) return;
      switch (msg.type) {
        case 'init': onInit(msg); break;
        case 'skin-state':
          state.custom = Boolean(msg && msg.custom);
          updateSkinButton();
          break;
        case 'capture': onCapture(msg); break;
        case 'analysis-delta': onDelta(msg); break;
        case 'analysis-replace': onReplace(msg); break;
        case 'analysis-done': onDone(); break;
        case 'analysis-error': onError(msg); break;
        case 'analysis-stopped': onStopped(); break;
        case 'thread': onThread(msg); break;
        case 'session-reset': onSessionReset(); break;
        default: break;
      }
    });
  }

  /* ---------- interactions ---------- */

  els.titlebar.addEventListener('mousedown', function (event) {
    if (event.button !== 0) return;
    if (event.target.closest('button')) return;
    event.preventDefault();
    post({ type: 'drag' });
  });

  els.minimize.addEventListener('click', function () { post({ type: 'minimize' }); });
  els.skin.addEventListener('click', function () { post({ type: 'skin' }); });
  els.close.addEventListener('click', function () { post({ type: 'close' }); });
  els.rescan.addEventListener('click', function () { post({ type: 'rescan' }); });

  els.stop.addEventListener('click', function () {
    if (!state.busy) return;
    post({ type: 'stop' });
    els.stop.classList.remove('on');
    setStatus('正在停止…', 'busy');
  });

  function updateThreadTag() {
    if (!els.threadTag) return;
    var count = state.turns.length;
    if (count <= 1) {
      els.threadTag.hidden = true;
      els.threadTag.textContent = '';
      return;
    }
    els.threadTag.hidden = false;
    els.threadTag.textContent = '第 ' + count + ' 轮';
  }

  /** Freezes the answer on screen into the turn list, then opens a new turn. */
  function recordTurn(question) {
    var last = state.turns.length > 0 ? state.turns[state.turns.length - 1] : null;
    if (last) {
      if (!last.a) last.a = state.text;
      if (state.stopped) last.stopped = true;
    }
    state.stopped = false;
    state.turns.push({ q: question, a: '' });
    state.text = '';
    updateThreadTag();
    // A soft nudge, never a hard stop: the thread still works past this point.
    if (state.turns.length === TURN_HINT_AT) {
      state.notice = '这条线索已经聊了 ' + TURN_HINT_AT + ' 轮，上下文变长会让回答变慢；换话题时点「重新框选」会更清爽。';
    }
  }

  function beginTurn(message, question) {
    state.error = '';
    state.notice = '';
    state.stick = true;
    recordTurn(question || '');
    els.note.value = '';
    setBusy(true);
    render();
    autosize();
    post(message);
  }

  els.send.addEventListener('click', function () {
    if (state.busy || !state.hasImage) return;
    var note = els.note.value.trim();
    if (state.sent) {
      if (!note) return;
      beginTurn({ type: 'followup', text: note }, note);
      return;
    }
    beginTurn({ type: 'send', note: note }, note || '这张图里有什么？');
    state.sent = true;
  });

  els.note.addEventListener('input', function () {
    autosize();
    updateSendState();
  });

  els.note.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      els.send.click();
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      event.preventDefault();
      post({ type: 'minimize' });
    }
  });

  els.body.addEventListener('click', function (event) {
    var node = event.target && event.target.closest ? event.target.closest('.turn-a') : null;
    if (!node) return;
    node.classList.toggle('open');
    scheduleMeasure();
  });

  els.shot.addEventListener('load', scheduleMeasure);
  els.content.addEventListener('scroll', function () {
    var distance = els.content.scrollHeight - els.content.scrollTop - els.content.clientHeight;
    state.stick = distance < 48;
  });

  if (window.ResizeObserver) {
    var resizeObserver = new ResizeObserver(scheduleMeasure);
    resizeObserver.observe(els.inner);
    resizeObserver.observe(document.querySelector('.composer'));
  }
  window.addEventListener('resize', scheduleMeasure);

  autosize();
  render();
  post({ type: 'ready' });
})();
</script>
</body>
</html>
