name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        run: |
          node --check index.js
          node --check client.js

      - name: 单元测试（宿主协议 / 停止链路 / 面板脚本）
        run: npm test

      - name: widget.ps1 解析
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'widget.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'widget.ps1 缺少 UTF-8 BOM：PowerShell 5.1 会按 ANSI 解码，中文全部乱码'
          }
          $tokens = $null
          $errors = $null
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ($_.Extent.StartLineNumber.ToString() + ': ' + $_.Message) }
            throw ('widget.ps1 解析失败：' + $errors.Count + ' 个错误')
          }
          Write-Host ('widget.ps1 解析通过，' + $tokens.Count + ' 个 token')
